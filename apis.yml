url: https://raw.githubusercontent.com/api-evangelist/aemc/refs/heads/main/apis.yml
name: Australian Energy Market Commission
kind: company
description: The Australian Energy Market Commission (AEMC) is the independent statutory
  rule maker for Australia's energy markets, established in 2005 and based in Sydney.
  It makes and amends the National Electricity Rules, National Gas Rules and National
  Energy Retail Rules, conducts market reviews, and advises the Energy and Climate
  Change Ministerial Council. It sits upstream of every other body in the Australian
  energy value chain — it writes the obligations that AEMO operates, that the AER
  enforces, and that retailers and networks must meet — but it operates no market
  systems and holds no consumer data itself. AEMC publishes no developer portal, no
  documented API, no OpenAPI and no open data product, and the corporate Drupal site
  at www.aemc.gov.au returns 404 for /api, /openapi.json, /swagger.json, /api-docs,
  /jsonapi and /graphql. It does, however, run one real machine-readable surface that
  it does not advertise — the Energy Rules application at energy-rules.aemc.gov.au is
  backed by an undocumented, entirely anonymous JSON API at /api/v1 that serves the
  full versioned text of all three rule books — 304 versions of the National
  Electricity Rules, 115 of the National Gas Rules and 65 of the National Energy
  Retail Rules — with a table of contents, per-clause content, full-text search, a
  complete defined-terms glossary and links to every published PDF and DOCX. That API
  is captured here as a derived OpenAPI built from AEMC's own production JavaScript
  bundle plus live probes. The other finding that matters is regulatory rather than
  technical — on 18 December 2025 the AEMC made a final rule giving all consumers and
  their AEMO-accredited representatives a right to real-time data from smart meters,
  with AEMO required to publish the technical procedures by 30 November 2026 and the
  meter obligation commencing 30 November 2028 — a mandate designated but not live,
  and separate from the Consumer Data Right, which is administered by Treasury, the
  ACCC and the Data Standards Body, with retailers as primary and AEMO as secondary
  data holder. AEMC is not a CDR data holder.
