apis:
- aid: aemc:aemc-energy-rules-api
  name: AEMC Energy Rules API
  description: The undocumented JSON API behind AEMC's Energy Rules application. It serves
    the consolidated, versioned text of the National Electricity Rules, National Gas Rules
    and National Energy Retail Rules — every published version with its commencement and
    start dates and its PDF/DOCX artefacts, the full chapter/part/division/rule/clause tree,
    per-node rule text, full-text search within a version, and the complete defined-terms
    glossary with cross-linked definitions. Verified live and entirely anonymous on
    2026-07-27 — no API key, no OAuth, no cookie, no CSRF token; responses carry
    x-ratelimit-limit 1000 and are served through AWS API Gateway in front of a Laravel
    application using the Laravel data/links/meta envelope and page/perPage pagination.
    AEMC publishes no documentation, terms of use, SLA, versioning or deprecation policy for
    it, and no OpenAPI — the specification in this repository is derived by API Evangelist
    from AEMC's own production client bundle plus live probes of every route, with the HTTP
    status of each probe recorded in x-evidence. Every path is keyed by the rule version id
    rather than the human-facing version number.
  humanURL: https://energy-rules.aemc.gov.au/
  baseURL: https://energy-rules.aemc.gov.au/api/v1
