- url: https://consumerdatastandardsaustralia.github.io/standards/
  type: Specification
  note: Consumer Data Standards, including the energy schemas; maintained by the
    Data Standards Body, not AEMC.

actions:
  apisYmlCreated: true
  apisArrayEmpty: false
  openapiDirectory: openapi/aemc-energy-rules-openapi-derived.yml (derived, not harvested)
  reason: |
    Round one left apis[] deliberately empty because nothing callable had been found.
    Round two (2026-07-27) found the undocumented AEMC Energy Rules API at
    energy-rules.aemc.gov.au/api/v1, probed every route anonymously, and listed it as
    one API with a DERIVED OpenAPI carrying per-operation x-evidence. Nothing was
    invented: no path, parameter, status code or response field appears that was not
    observed on a live response or read literally out of AEMC's own production
    JavaScript bundle. The state-changing approval route found in that bundle was not
    probed and is not modelled. The site RSS feed remains a common[] property rather
    than an API.
