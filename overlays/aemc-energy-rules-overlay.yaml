      data_model: data-model/aemc-data-model.yml
      examples: examples/_index.yml
      skills: skills/_index.yml
    x-apievangelist-status: undocumented-public
    x-apievangelist-warning: >-
      Undocumented internal API of a public AEMC website. No published terms of use, SLA, support
      channel or versioning policy. Verify before depending on it in production.
- target: $.paths['/rules/{versionId}/toc'].get
  update:
    x-apievangelist-note: >-
      The path parameter is the rule version id (e.g. 803), not the human-facing version number
      (e.g. 251). Passing the version number returns HTTP 404.
- target: $.paths['/rules/{ruleType}/versions'].get
  update:
    x-apievangelist-note: >-
      showAll=true returns the entire version history in a single response (4.5 MB for ner as at
      2026-07-27). Prefer page/perPage unless the whole history is genuinely needed.
- target: $.paths['/rules/{versionId}/search'].get
  update:
    x-apievangelist-note: >-
      Search is scoped to a single rule version. To search "the current rules", resolve the current
      version id from listRuleVersions first (data[0].id, or the entry with is_current = 1).
