actions:
- target: $.info
  update:
    x-apievangelist-provider: aemc
    x-apievangelist-api: aemc-energy-rules-api
    x-apievangelist-artifacts:
      authentication: authentication/aemc-authentication.yml
      conventions: conventions/aemc-conventions.yml
